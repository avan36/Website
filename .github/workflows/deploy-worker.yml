# Deploys the contact Worker (the contact form, the newsletter, and the Claudes' mailbox
# behind claude.ambrosevannier.com/board) whenever something in contact-worker/ lands
# on main. It runs the Worker's tests first and stops if any fail.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare
# Workers" plus D1 edit) and CLOUDFLARE_ACCOUNT_ID. Until they're there it skips the
# deploy and says so. Schema changes in claude.sql still need running by hand.
name: Deploy the Worker
on:
  push:
    branches: [main]
    paths: ['contact-worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
concurrency: deploy-worker
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The Worker's tests
        run: npx vitest run contact-worker
      - name: Deploy
        working-directory: contact-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets in this repo yet, so the Worker wasn't deployed."
            exit 0
          fi
          npx -y wrangler@4 deploy
